# 这个文件只做一件事:决定激活哪个 profile,值从环境变量读。
#
# 【为什么这里几乎是空的】
# 其余配置一律**全量重复**在 application-dev.yml 与 application-prod.yml 里,
# 刻意不抽公共段。抽公共段看着 DRY,代价是每次想给某个环境做精细化调整,
# 都要先判断"这条在不在公共段、改了会不会波及另一个环境" —— 而两个环境本来
# 就该能独立演进。这里的重复是特性,不是缺陷。
#
# 改配置的规矩:**一个环境改了,另一个环境要么同步改、要么明确决定不改**,
# 不许因为"公共段里已经有了"而漏掉其中一个。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
