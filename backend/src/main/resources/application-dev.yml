# dev = 本机开发。与 application-prod.yml **全量重复**,刻意不抽公共段(理由见 application.yml)。
#
# 严禁把这里的连接指向 prod 数据库,哪怕只是换个库名。
# Flyway 在启动时自动执行 DDL,配置写错一次就直接改了生产库结构,
# 而 Flyway 铁律是"已执行的脚本不能改",污染 flyway_schema_history 后清理极其痛苦。

spring:
  application:
    name: skill-hub

  servlet:
    multipart:
      # skill 包是几十 KB 到几 MB 的 zip,给足余量但不放任
      max-file-size: 32MB
      max-request-size: 64MB

  datasource:
    # 基座 PG 由 docker compose 起,宿主端口 15432(避开 WSL 里其他项目的 5432)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:skillhub}
    username: ${DB_USER:skillhub}
    password: ${DB_PASSWORD:skillhub}

  flyway:
    enabled: true
    # dev 库可能是从半途接手的,允许在非空库上打基线
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:18080}
  servlet:
    # 前端 vite.config.ts 的 base 必须同步为 /skillhub/
    context-path: /skillhub

mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 自定义 TypeHandler(java.time.Instant <-> TIMESTAMPTZ)统一放这个包,starter 自动扫描注册。
  type-handlers-package: com.landray.skillhub.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # dev 要看得见 DB / 磁盘的具体状态,排障方便
      show-details: always

# OpenAPI(springdoc)。dev 全开:接口文档与 swagger-ui 都是开发期工具。
# 完整地址带 context-path:http://localhost:18080/skillhub/v3/api-docs
#                          http://localhost:18080/skillhub/swagger-ui.html
# 前端 TS 类型由这里导出的 openapi.json 生成(业务建模文档 8.3)。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 不排序的话接口顺序跟着扫描顺序漂,每次加一个 Controller 整页都在动,没法 diff
    tags-sorter: alpha
    operations-sorter: alpha

skillhub:
  storage:
    # P0 用本地文件夹实现 ArtifactStorage,业务代码只认接口
    type: local
    local-root: ${ARTIFACT_ROOT:./data/artifacts}

  # 上传管线的解包上限(业务建模文档 5.2)。**必须在解压过程中实时生效**,不能解压完再查——
  # 一个 32MB 的包(multipart 上限见 spring.servlet.multipart,与这里无关)可以解压出几十 GB。
  # 与 multipart.max-file-size 是两件事:那个卡的是"上传的 zip 本身多大",这里卡的是"解压后能有多大"。
  upload:
    max-unpacked-bytes: 67108864 # 64MB,skill zip 实际几十 KB 到几 MB,两个数量级余量
    max-entry-count: 500 # 一个 skill 带满 references/scripts/assets 也到不了三位数
    max-file-bytes: 16777216 # 16MB,超过这个体积的东西不该放进 skill 包
    max-path-depth: 8 # <name>/references/a/b/c/ 已经很深(剥顶层包裹目录之后计算)
    max-path-length: 255 # 与 artifact_key 列宽一致,也避开各平台路径上限
    max-compression-ratio: 100 # 正常文本压缩比在 3~10:1,超过 100:1 判定为 zip 炸弹

  auth:
    # P0 默认关闭自助注册:内网谁都能访问页面,开着意味着任何人都能注册后上传恶意 skill
    # (业务建模文档 3.2)。dev 同样默认关闭,要联调注册流程时手动打开。
    local-register-enabled: ${LOCAL_REGISTER_ENABLED:false}
    bootstrap-admin:
      login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
      # dev 给一个开箱即用的默认密码,方便本机启动;prod 绝不允许有默认值(见 application-prod.yml)。
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123456}

  install:
    # 渲染安装脚本时拼接下载 URL 的基地址(含 context-path)。脚本下载后在用户本机离线执行,
    # 不能从 server.port/context-path 反推出这台服务器对外可达的地址,必须显式配置;
    # dev 给一个开箱即用的默认值,与本文件上方 server.port: 18080 + context-path: /skillhub 对齐。
    public-base-url: ${INSTALL_PUBLIC_BASE_URL:http://localhost:18080/skillhub}
    # 安装单有效期(天),防止旧命令在群里流传半年后还在装过期版本(根 CLAUDE.md 第七节)。
    # 业务建模文档 4.13 只要求"必须有有效期"未给具体数值,30 天是本轮实现按团队内分享通常几周内
    # 消化完选定的默认值,详见 InstallProperties 类注释。
    bundle-ttl-days: ${INSTALL_BUNDLE_TTL_DAYS:30}

# 日志:控制台人类可读,文件 JSONL(ECS)。形态与 prod 一致,量级按 dev 放宽。
logging:
  level:
    root: INFO
    com.landray.skillhub: DEBUG
    # dev 打 SQL 与参数绑定,prod 一律关掉
    org.mybatis: DEBUG

  charset:
    # 文件通道恒定 UTF-8,不跟随平台:它是 ECS JSONL,消费者永远是 grep / jq / 日志采集。
    # 控制台通道刻意不配 —— 交给 ConsoleEncodingEnvironmentPostProcessor 按"有没有接终端"探测,
    # 在这里写死会把探测结果顶掉(那个类遇到显式配置就完全不插手)。
    file: UTF-8

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faded} %clr(%5p) %clr([%X{traceId:-------------}]){magenta} %clr([%12.12t]){faded} %clr(%-44.44logger{43}){cyan} %clr(:){faded} %m%n%wEx"

  file:
    name: ${LOG_ROOT:./logs}/skill-hub.jsonl

  structured:
    format:
      # 控制台刻意不给 JSON —— 开发时用肉眼读 JSON 是自虐
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:0.1.0}
        environment: dev
    json:
      stacktrace:
        # 根因放最前面。默认 root-last 要先翻到底部才看得到真正的异常
        root: first
        max-length: 8192
        include-common-frames: false

  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_ROOT:./logs}/skill-hub.%d{yyyy-MM-dd}.%i.jsonl.gz
      max-file-size: 50MB
      # dev 只留一周,本机不需要长期留存
      max-history: 7
      total-size-cap: 500MB
      clean-history-on-start: true
