# dev = 本机开发。与 application-prod.yml **全量重复**,刻意不抽公共段(理由见 application.yml)。
#
# 严禁把这里的连接指向 prod 数据库,哪怕只是换个库名。
# Flyway 在启动时自动执行 DDL,配置写错一次就直接改了生产库结构,
# 而 Flyway 铁律是"已执行的脚本不能改",污染 flyway_schema_history 后清理极其痛苦。

spring:
  application:
    name: skill-hub

  servlet:
    multipart:
      # skill 包是几十 KB 到几 MB 的 zip,给足余量但不放任
      max-file-size: 32MB
      max-request-size: 64MB

  datasource:
    # 基座 PG 由 docker compose 起,宿主端口 15432(避开 WSL 里其他项目的 5432)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:skillhub}
    username: ${DB_USER:skillhub}
    password: ${DB_PASSWORD:skillhub}

  flyway:
    enabled: true
    # dev 库可能是从半途接手的,允许在非空库上打基线
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:18080}
  servlet:
    # 前端 vite.config.ts 的 base 必须同步为 /skillhub/
    context-path: /skillhub

mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 自定义 TypeHandler(java.time.Instant <-> TIMESTAMPTZ)统一放这个包,starter 自动扫描注册。
  type-handlers-package: com.landray.skillhub.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # dev 要看得见 DB / 磁盘的具体状态,排障方便
      show-details: always

# OpenAPI(springdoc)。dev 全开:接口文档与 swagger-ui 都是开发期工具。
# 完整地址带 context-path:http://localhost:18080/skillhub/v3/api-docs
#                          http://localhost:18080/skillhub/swagger-ui.html
# 前端 TS 类型由这里导出的 openapi.json 生成(业务建模文档 8.3)。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 不排序的话接口顺序跟着扫描顺序漂,每次加一个 Controller 整页都在动,没法 diff
    tags-sorter: alpha
    operations-sorter: alpha

skillhub:
  storage:
    # 制品存储选型。dev 与 prod 都走 S3 兼容对象存储(阿里云 OSS),靠 s3.key-prefix 把两个环境隔开,
    # 共用一个桶而互不可见。两边全量重复写一遍,不抽公共段(理由见 application.yml 顶部)。
    #
    # 想回到本地文件夹:把这里改回 local 即可。下面的 local-root 与 compose 里的 artifact 卷都保留着,
    # 切换前的存量制品还在原处 —— 这是这次切换刻意留下的回退路径,不要顺手删掉。
    type: s3

    s3:
      # 必须是带 s3. 前缀的 S3 兼容端点,不是控制台首页那个 oss-cn-* 域名。
      # 也**不能**用 -internal 内网端点:那个只在同地域阿里云 ECS 内可解析,而本项目部署在公司内网机器上,
      # 实测 DNS 能解析成 100.115.61.3 但连不通(超时),表现为上传一直挂住。
      endpoint: https://s3.oss-cn-hongkong.aliyuncs.com
      # OSS 的 S3 兼容层只认 aws-global。已对真桶实测:cn-hongkong / oss-cn-hongkong 都过不了签名校验。
      region: aws-global
      bucket: nodetimetop
      # **前缀是硬要求不是可选项**:这个桶不被 skillhub 独占,桶根下还有 share/ 等别的用途,
      # 不加前缀会和它们混在一起。dev 与 prod 的差异就只有这一行。
      key-prefix: skillhub-dev/
      # 凭证不写进 yml。给空默认值是为了让不碰存储的测试能照常启动(它们被 surefire 钉成 type: local);
      # type: s3 时真缺失会在 S3ArtifactStorage 构造时报"必填,当前为空"并让启动失败,不会带着空 AK 跑。
      access-key: ${OSS_ACCESS_KEY_ID:}
      secret-key: ${OSS_SECRET_ACCESS_KEY:}
      # 阿里云 OSS 走 virtual-hosted;MinIO 之类没配通配符 DNS 的实现才需要 true。
      path-style-access: false

    # 下面的 local-root 只在 type: local 时生效 —— 不是死配置:集成测试会把 type 覆盖回 local
    # 并把这个值指到 @TempDir,DevPathConfigurationTest 也直接对它断言。
    # **默认值必须是绝对路径,不许再用 ./xxx。**
    #
    # 上一版写的是 `./data/artifacts`,相对路径按 JVM 的当前工作目录解析,于是同一份配置在三种启动方式下
    # 指向三个不同的目录:`cd backend && mvn spring-boot:run` -> backend/data/artifacts;IDEA 按模块根或
    # 项目根启动 -> 另外两个位置。踩到的实况是:制品全部读不到,而界面上只表现为详情页文件树空着
    # (读不到被降级成"清单为空"),跟"这个包本来就没文件"长得一模一样。
    #
    # `skillhub.project-home` 由 ProjectHomeEnvironmentPostProcessor 从**代码位置**推出模块根(向上找
    # pom.xml),与工作目录无关。所以 IDEA / 命令行 / 仓库根三种启法都落在同一个 backend/data/artifacts。
    #
    # 中间曾短暂改成 ${user.home}/.skillhub,那样确实解决了漂移,但把项目数据堆进用户配置目录,
    # 既不好找也和项目本身脱节,已换掉。
    #
    # prod 不做同样改动:那边 ARTIFACT_ROOT 无默认值、必须显式给绝对路径(compose 里是 /app/data/artifacts
    # 加命名卷),而且容器的 WORKDIR 固定,不存在"从哪启动"这个变量。
    local-root: ${ARTIFACT_ROOT:${skillhub.project-home}/data/artifacts}

  # 上传管线的解包上限(业务建模文档 5.2)。**必须在解压过程中实时生效**,不能解压完再查——
  # 一个 32MB 的包(multipart 上限见 spring.servlet.multipart,与这里无关)可以解压出几十 GB。
  # 与 multipart.max-file-size 是两件事:那个卡的是"上传的 zip 本身多大",这里卡的是"解压后能有多大"。
  upload:
    max-unpacked-bytes: 67108864 # 64MB,skill zip 实际几十 KB 到几 MB,两个数量级余量
    max-entry-count: 500 # 一个 skill 带满 references/scripts/assets 也到不了三位数
    max-file-bytes: 16777216 # 16MB,超过这个体积的东西不该放进 skill 包
    max-path-depth: 8 # <name>/references/a/b/c/ 已经很深(剥顶层包裹目录之后计算)
    max-path-length: 255 # 与 artifact_key 列宽一致,也避开各平台路径上限
    max-compression-ratio: 100 # 正常文本压缩比在 3~10:1,超过 100:1 判定为 zip 炸弹

  auth:
    # dev 默认**开启**自助注册,与 prod 刻意相反(prod 见 application-prod.yml)。
    #
    # 业务建模文档 3.2 关闭它的理由是"内网谁都能访问页面,任何人都能注册后上传恶意 skill",
    # 那条风险的前提是"谁都能访问",而 dev 只有本机自己能访问,前提不成立。反过来关着的代价是
    # 每次想验注册流程都得先记起有这么个环境变量 —— 登录页的注册入口直接消失,看起来像功能没做,
    # 而不是像被关掉了。这与本文件给 bootstrap-admin 配默认密码是同一条取舍:dev 开箱即用,
    # prod 一律从严。
    local-register-enabled: ${LOCAL_REGISTER_ENABLED:true}
    bootstrap-admin:
      login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
      # dev 给一个开箱即用的默认密码,方便本机启动;prod 绝不允许有默认值(见 application-prod.yml)。
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123456}

  install:
    # 渲染安装脚本时拼接下载 URL 的基地址(含 context-path)。脚本下载后在用户本机离线执行,
    # 不能从 server.port/context-path 反推出这台服务器对外可达的地址,必须显式配置;
    # dev 给一个开箱即用的默认值,与本文件上方 server.port: 18080 + context-path: /skillhub 对齐。
    public-base-url: ${INSTALL_PUBLIC_BASE_URL:http://localhost:18080/skillhub}
    # 安装单有效期(天),防止旧命令在群里流传半年后还在装过期版本(根 CLAUDE.md 第七节)。
    # 业务建模文档 4.13 只要求"必须有有效期"未给具体数值,30 天是本轮实现按团队内分享通常几周内
    # 消化完选定的默认值,详见 InstallProperties 类注释。
    bundle-ttl-days: ${INSTALL_BUNDLE_TTL_DAYS:30}

# 日志:控制台人类可读,文件 JSONL(ECS)。形态与 prod 一致,量级按 dev 放宽。
logging:
  level:
    root: INFO
    com.landray.skillhub: DEBUG
    # dev 打 SQL 与参数绑定,prod 一律关掉
    org.mybatis: DEBUG

  charset:
    # 文件通道恒定 UTF-8,不跟随平台:它是 ECS JSONL,消费者永远是 grep / jq / 日志采集。
    # 控制台通道刻意不配 —— 交给 ConsoleEncodingEnvironmentPostProcessor 按"有没有接终端"探测,
    # 在这里写死会把探测结果顶掉(那个类遇到显式配置就完全不插手)。
    file: UTF-8

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faded} %clr(%5p) %clr([%X{traceId:-------------}]){magenta} %clr([%12.12t]){faded} %clr(%-44.44logger{43}){cyan} %clr(:){faded} %m%n%wEx"

  file:
    # 同 skillhub.storage.local-root 的理由:相对路径会让日志跟着启动方式散落到不同目录。
    # 实际吃过亏——排查制品读不到时,应用的日志写在仓库根、我在 backend/logs 里翻,两边对不上,
    # 白绕了一圈。日志是排障的起点,它自己的位置最不该是个变量。
    name: ${LOG_ROOT:${skillhub.project-home}/logs}/skill-hub.jsonl

  structured:
    format:
      # 控制台刻意不给 JSON —— 开发时用肉眼读 JSON 是自虐
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:0.1.0}
        environment: dev
    json:
      stacktrace:
        # 根因放最前面。默认 root-last 要先翻到底部才看得到真正的异常
        root: first
        max-length: 8192
        include-common-frames: false

  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_ROOT:./logs}/skill-hub.%d{yyyy-MM-dd}.%i.jsonl.gz
      max-file-size: 50MB
      # dev 只留一周,本机不需要长期留存
      max-history: 7
      total-size-cap: 500MB
      clean-history-on-start: true
