# prod = 内网服务器。连接信息一律走环境变量,此处不留任何默认凭据。
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false

skillhub:
  storage:
    type: local
    local-root: ${ARTIFACT_ROOT}

logging:
  level:
    com.landray.skillhub: INFO
