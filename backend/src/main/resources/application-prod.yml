# prod = 内网服务器。与 application-dev.yml **全量重复**,刻意不抽公共段(理由见 application.yml)。
#
# 连接信息一律走环境变量,**此处不留任何默认凭据** —— 少一个占位默认值,
# 就少一次"忘了配也能起来、起来了连的却是错的库"的事故。

spring:
  application:
    name: skill-hub

  servlet:
    multipart:
      # skill 包是几十 KB 到几 MB 的 zip,给足余量但不放任
      max-file-size: 32MB
      max-request-size: 64MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    # prod 库必须从 V0001 一路迁上来。开 baseline 会跳过已有脚本,
    # 相当于默认"库结构已经对了",出问题时无从追溯。
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:18080}
  servlet:
    # 前端 vite.config.ts 的 base 必须同步为 /skillhub/
    context-path: /skillhub

mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 自定义 TypeHandler(java.time.Instant <-> TIMESTAMPTZ)统一放这个包,starter 自动扫描注册。
  type-handlers-package: com.landray.skillhub.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        # 只开 health,给容器 HEALTHCHECK 用。多开一个端点就是多一份攻击面。
        include: health
  endpoint:
    health:
      # 不对外泄漏依赖组件的细节(DB 地址、磁盘路径等)
      show-details: never

# OpenAPI(springdoc)。**prod 默认全关**,与上面 actuator "多开一个端点就是多一份攻击面"同一判断。
#
# 为什么关得起:8.3 那条"后端导出 openapi.json -> 前端生成 TS 类型"是**开发期**动作,dev 有就够了,
# prod 开着不产生任何额外价值。而 swagger-ui 是个"try it out"控制台 —— 管理员带着有效会话打开它,
# 一次误点就是一次真实的写操作,这个平台的写操作是往别人机器上分发会被 Agent 执行的内容。
#
# 留开关而不是写死 false:真有人要在内网 prod 上排查接口时能临时打开,但那必须是一次
# **有意识的决定**(改环境变量重启),不是默认就敞着。
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

skillhub:
  storage:
    # 与 dev 同构,只有 key-prefix 不同。回退路径见 dev 档同位置的说明。
    type: s3

    s3:
      endpoint: https://s3.oss-cn-hongkong.aliyuncs.com
      region: aws-global
      bucket: nodetimetop
      # 与 dev 的唯一差异。两个环境共用一个桶,靠这一行互不可见。
      key-prefix: skillhub-prod/
      access-key: ${OSS_ACCESS_KEY_ID:}
      secret-key: ${OSS_SECRET_ACCESS_KEY:}
      path-style-access: false

    # 仅在 type: local 时生效,保留作回退路径:compose 里的 artifact 卷与 ARTIFACT_ROOT 都还在,
    # 把上面的 type 改回 local 就能回到切 OSS 之前的状态(存量制品没被删)。
    local-root: ${ARTIFACT_ROOT}

  # 上传管线的解包上限(业务建模文档 5.2)。与 dev 全量重复,当前两边取值一致——
  # 但这是两份独立的配置,以后任一环境需要单独调整都不牵连另一边。
  upload:
    max-unpacked-bytes: 67108864 # 64MB
    max-entry-count: 500
    max-file-bytes: 16777216 # 16MB
    max-path-depth: 8
    max-path-length: 255
    max-compression-ratio: 100

  auth:
    # 保持关闭,与 dev 刻意相反(dev 默认开,理由见 application-dev.yml)。
    #
    # 内网谁都能访问页面,开着意味着任何人都能注册 -> 上传结构合规但正文恶意的 skill ->
    # 被别人装进 Claude Code 执行。P0 认证机制还没上,没有任何一道防线覆盖内容语义
    # (业务建模文档 3.2)。要开就显式设 LOCAL_REGISTER_ENABLED=true,让它是一个有人负责的决定。
    local-register-enabled: ${LOCAL_REGISTER_ENABLED:false}
    bootstrap-admin:
      login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
      # 刻意不留默认值:未配置时 BootstrapAdminEnvironmentValidator 在启动最早期(EnvironmentPostProcessor,
      # 早于 DataSource/Flyway)拒绝启动。一个带公开默认密码的 ADMIN 比没有管理员更危险,
      # "启动失败"能被立刻发现,"默认密码"不会(业务建模文档 3.2)。
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  install:
    # 必须显式配置,不留默认值——内网地址因部署环境而异,与上面 skillhub.storage.local-root 的处理方式一致,
    # 未配置时启动仍会成功(这里不是 fail-fast 校验点),但渲染出的下载 URL 会明显错误,便于第一次联调时发现。
    public-base-url: ${INSTALL_PUBLIC_BASE_URL}
    bundle-ttl-days: ${INSTALL_BUNDLE_TTL_DAYS:30}

# 日志:控制台人类可读(交给 docker logs),文件 JSONL(ECS)落挂载卷。
logging:
  level:
    root: INFO
    com.landray.skillhub: INFO
    # prod 绝不打 SQL:量大、拖慢、且参数里可能带敏感值

  charset:
    # 文件通道恒定 UTF-8,不跟随平台:它是 ECS JSONL,消费者永远是 grep / jq / 日志采集。
    # 控制台通道刻意不配 —— 交给 ConsoleEncodingEnvironmentPostProcessor 按"有没有接终端"探测。
    # prod 跑在容器里,探测结果必然是 UTF-8(没有终端),这里保持与 dev 同样的形态便于对照。
    file: UTF-8

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faded} %clr(%5p) %clr([%X{traceId:-------------}]){magenta} %clr([%12.12t]){faded} %clr(%-44.44logger{43}){cyan} %clr(:){faded} %m%n%wEx"

  file:
    name: ${LOG_ROOT:./logs}/skill-hub.jsonl

  structured:
    format:
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:0.1.0}
        environment: prod
    json:
      stacktrace:
        root: first
        max-length: 8192
        include-common-frames: false

  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_ROOT:./logs}/skill-hub.%d{yyyy-MM-dd}.%i.jsonl.gz
      max-file-size: 100MB
      # 保留 7 天且总量不超过 1GB,两个条件谁先触发谁生效 ——
      # 只设天数挡不住某天被刷爆磁盘,只设总量又可能刚出问题就被滚掉。
      max-history: 7
      total-size-cap: 1GB
      clean-history-on-start: true
