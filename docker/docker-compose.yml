# skill-hub 编排 —— 仍然只有这一个文件,但应用分成 dev / prod 两档,互不干扰。
#
# ============================================================
#  怎么起
# ============================================================
#   只起基座(最常用:应用在 IDE / mvn spring-boot:run 里跑,热重载)
#     docker compose -f docker/docker-compose.yml up -d postgres
#
#   dev 档,应用也跑在容器里(不想装本地 JDK、或要验证 dev 配置的完整链路)
#     docker compose -f docker/docker-compose.yml --profile dev up -d --build
#
#   prod 档
#     docker compose -f docker/docker-compose.yml --profile prod up -d --build
#
#   停(注意:不带 --profile 时 compose 看不见带 profile 的服务,停不掉)
#     docker compose -f docker/docker-compose.yml --profile dev  down
#     docker compose -f docker/docker-compose.yml --profile prod down
#
# postgres 不带 profile,所以任何一档都会把它带起来。
#
# ============================================================
#  两个纪律
# ============================================================
#  1. 只用命名卷,不许绑定挂载。
#     daemon 跑在 WSL 里,`./data:/x` 这种写法 CLI 会展开成 `D:\...` 传过去,
#     daemon 当 Linux 路径解析直接失败。详见根 CLAUDE.md 10.1。
#
#  2. app-dev 与 app-prod 共用同一个镜像、同一个 postgres,只有 SPRING_PROFILES_ACTIVE
#     不同 —— 这正是要验证的东西:同一个制品在两种 profile 下都能起来。
#     但**数据卷各自独立**,dev 的制品和日志绝不能混进 prod。
#
#  【必读】密码:
#    下面的默认值只为让本机 dev 开箱即用。**prod 部署前必须先
#    `cp docker/.env.example docker/.env` 并改掉 DB_PASSWORD**,
#    compose 会自动读取同目录的 .env。.env 已在 .gitignore 里,不会入库。

name: skillhub

services:
  postgres:
    image: postgres:17-alpine
    container_name: skillhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-skillhub}
      POSTGRES_USER: ${DB_USER:-skillhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillhub}
      # 初始化时锁死编码与排序规则:不锁的话不同宿主 locale 会让
      # ORDER BY / 唯一索引的行为出现差异,这种问题极难排查。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      # 宿主 15432,避开 WSL 里其他项目占着的 5432(根 CLAUDE.md 10.1)。
      # 绑 127.0.0.1:数据库不对外暴露,只给本机与本机上的容器网络用。
      - "127.0.0.1:${DB_PORT_HOST:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 应用的 depends_on 依赖这个 —— 没有它,应用会在 PG 还没 ready 时启动,
      # Flyway 直接连接失败退出。
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skillhub} -d ${DB_NAME:-skillhub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------
  # dev 档:同一个镜像,SPRING_PROFILES_ACTIVE=dev
  # 对应 application-dev.yml:DEBUG 日志、打 SQL、health 显示明细、日志只留 7 天
  # ----------------------------------------------------------
  app-dev:
    profiles: ["dev"]
    build: &app-build
      # context 是仓库根目录:Dockerfile 要同时拿到 backend/ 和 frontend/
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    image: skillhub/app:${APP_VERSION:-0.1.0}
    container_name: skillhub-app-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "18080"
      # 容器间走 service 名 + 容器内端口,与宿主映射的 15432 无关
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skillhub}
      DB_USER: ${DB_USER:-skillhub}
      DB_PASSWORD: ${DB_PASSWORD:-skillhub}
      ARTIFACT_ROOT: /app/data/artifacts
      LOG_ROOT: /app/logs
      APP_VERSION: ${APP_VERSION:-0.1.0}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs}
    ports:
      # 与 app-prod 同端口:两档是互斥的,不该同时起。
      # 真同时起了,后起的那个会报端口冲突 —— 这是想要的行为,不是 bug。
      - "${APP_PORT:-18080}:18080"
    volumes:
      - artifact-data-dev:/app/data/artifacts
      - app-logs-dev:/app/logs

  # ----------------------------------------------------------
  # prod 档:同一个镜像,SPRING_PROFILES_ACTIVE=prod
  # 对应 application-prod.yml:INFO 日志、不打 SQL、health 不显示明细、日志留 30 天
  # ----------------------------------------------------------
  app-prod:
    profiles: ["prod"]
    build: *app-build
    image: skillhub/app:${APP_VERSION:-0.1.0}
    container_name: skillhub-app-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "18080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skillhub}
      DB_USER: ${DB_USER:-skillhub}
      DB_PASSWORD: ${DB_PASSWORD:-skillhub}
      ARTIFACT_ROOT: /app/data/artifacts
      LOG_ROOT: /app/logs
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # ------------------------------------------------------
      # prod 独有的三个必填项。**刻意不写 `:-默认值`**
      #
      # 漏配时 compose 传空串,应用在启动最早期就响亮地失败:
      #   BOOTSTRAP_ADMIN_PASSWORD  -> BootstrapAdminEnvironmentValidator 直接拒绝启动
      #   INSTALL_PUBLIC_BASE_URL   -> 占位符解析不出来,启动失败
      # 给了默认值就变成"忘了配也能起来,起来了却是错的" —— 一个带公开默认密码的 ADMIN
      # 比没有管理员更危险,而一个指向 localhost 的安装地址会让所有人拿到装不上的命令。
      #
      # app-dev 不需要这三行:dev 档在 application-dev.yml 里给了默认值,本机开箱即用。
      # 两个环境的配置刻意全量重复、独立演进(根 CLAUDE.md 10.0),这里就是那条规矩的体现。
      # ------------------------------------------------------
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      INSTALL_PUBLIC_BASE_URL: ${INSTALL_PUBLIC_BASE_URL}
      # 内网谁都能访问页面,开着等于任何人都能注册并上传会被 Agent 执行的内容。
      # 要开必须是一个有人负责的决定,不是默认就敞着(application-prod.yml 里有完整理由)。
      LOCAL_REGISTER_ENABLED: ${LOCAL_REGISTER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs}
    ports:
      - "${APP_PORT:-18080}:18080"
    volumes:
      - artifact-data-prod:/app/data/artifacts
      - app-logs-prod:/app/logs

volumes:
  # 普通命名卷。`down` 不删数据,`down -v` 会删。
  # 现阶段库里是 skill 制品与元数据,真删了让大家重新上传即可;
  # 等有了安装统计 / 审核记录再回头做备份或改 external。
  postgres-data:
  # dev 与 prod 的制品、日志各自独立,绝不共用
  artifact-data-dev:
  app-logs-dev:
  artifact-data-prod:
  app-logs-prod:
