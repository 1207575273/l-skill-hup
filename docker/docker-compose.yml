# skill-hub 编排 —— 就这一个文件,dev 与 prod 共用。
#
#   dev  (本机)      docker compose -f docker/docker-compose.yml up -d postgres
#                    应用用 IDE / mvn spring-boot:run 直接跑,前端用 Vite dev server
#   prod (内网服务器) docker compose -f docker/docker-compose.yml up -d --build
#
# 不拆文件、不用 profiles、不用 external 卷 —— 理由见根 CLAUDE.md 第十节。
#
# 【必读】密码:
#   下面的默认值只为让本机 dev 开箱即用。**prod 部署前必须先 `cp docker/.env.example docker/.env`
#   并改掉 DB_PASSWORD**,compose 会自动读取同目录的 .env。
#   .env 已在 .gitignore 里,不会入库。
#
# 【纪律】只用命名卷,不许绑定挂载。
#   daemon 跑在 WSL 里,`./data:/x` 这种写法 CLI 会展开成 `D:\...` 传过去,
#   daemon 当 Linux 路径解析直接失败。详见根 CLAUDE.md 10.1。

name: skillhub

services:
  postgres:
    image: postgres:17-alpine
    container_name: skillhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-skillhub}
      POSTGRES_USER: ${DB_USER:-skillhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillhub}
      # 初始化时锁死编码与排序规则:不锁的话不同宿主 locale 会让
      # ORDER BY / 唯一索引的行为出现差异,这种问题极难排查。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      # 宿主 15432,避开 WSL 里其他项目占着的 5432(根 CLAUDE.md 10.1)。
      # 绑 127.0.0.1:数据库不对外暴露,只给本机 / 本机上的容器网络用。
      - "127.0.0.1:${DB_PORT_HOST:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # app 的 depends_on 依赖这个 —— 没有它,应用会在 PG 还没 ready 时启动,
      # Flyway 直接连接失败退出。
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skillhub} -d ${DB_NAME:-skillhub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      # context 是仓库根目录:Dockerfile 要同时拿到 backend/ 和 frontend/
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    image: skillhub/app:${APP_VERSION:-0.1.0}
    container_name: skillhub-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "18080"
      # 容器间走 service 名 + 容器内端口,与宿主映射的 15432 无关
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-skillhub}
      DB_USER: ${DB_USER:-skillhub}
      DB_PASSWORD: ${DB_PASSWORD:-skillhub}
      # 制品与日志都落在挂了命名卷的路径上,容器重建不丢
      ARTIFACT_ROOT: /app/data/artifacts
      LOG_ROOT: /app/logs
      # 进 JSONL 日志的 service.version 字段,排障时一眼看出跑的哪个版本
      APP_VERSION: ${APP_VERSION:-0.1.0}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "${APP_PORT:-18080}:18080"
    volumes:
      - artifact-data:/app/data/artifacts
      - app-logs:/app/logs

volumes:
  # 普通命名卷。`down` 不删数据,`down -v` 会删。
  # 现阶段库里是 skill 制品与元数据,真删了让大家重新上传即可;
  # 等有了安装统计 / 审核记录再回头做备份或改 external。
  postgres-data:
  artifact-data:
  app-logs:
